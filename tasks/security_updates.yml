- name: Security updates
  hosts: all
  gather_facts: no
  tasks:
    - name: Sprawdź wersję systemu
      shell: "grep -o 'release 8' /etc/redhat-release || echo '9'"
      register: rhel_version
      changed_when: false

    - name: Aktualizacja BEZPIECZEŃSTWA dla RHEL 8
      command: dnf update --security -y
      when: "'release 8' in rhel_version.stdout"

    - name: Aktualizacja BEZPIECZEŃSTWA dla RHEL 9
      dnf:
        name: '*'
        state: latest
        security: yes  # To jest kluczowe dla modułu dnf
      when: "'9' in rhel_version.stdout"
