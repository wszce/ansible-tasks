---
- name: Security updates
  hosts: all
  # Tutaj NIE UŻYWAJ 'gather_facts: false', zostaw domyślnie.
  # Jeśli interpreter 3.9 zadziała, 'setup' po prostu przejdzie na 3.9.
  tasks:
    - name: Update RHEL 8
      command: dnf update --security -y
      when: ansible_distribution_major_version == '8'

    - name: Update RHEL 9
      dnf:
        name: '*'
        state: latest
        security: yes
      when: ansible_distribution_major_version == '9'

